# Feast Configuration - LOCAL BACKEND (SQLite)
# This is for local development and testing
# For GCP, replace with the BigQuery configuration at the end

project: iris_feature_store
registry: data/registry.db
provider: local

offline_store:
  type: file

online_store:
  type: sqlite
  path: data/online_store.db

---
